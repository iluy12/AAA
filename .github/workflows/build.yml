name: Build debug APK

"on":
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Actions Artifacts require a logged-in GitHub session to download.
      # Release assets are public, unauthenticated, direct-download URLs —
      # for installing straight from the watch's browser without going
      # through GitHub's UI. Each run gets its own tag (build-<run_number>,
      # always increasing, never reused) so every past build stays
      # published as its own release — nothing here is ever overwritten
      # or deleted. The link changes every time; find the newest one at:
      # https://github.com/iluy12/AAA/releases
      - name: Publish this build as a new public GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "Debug build #${{ github.run_number }}"
          body: "Commit: ${{ github.sha }}"
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            rescue/build/outputs/apk/debug/rescue-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
