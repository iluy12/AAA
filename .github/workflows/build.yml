name: Build debug APK

"on":
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Actions Artifacts require a logged-in GitHub session to download.
      # Release assets are public, unauthenticated, direct-download URLs —
      # this keeps ONE stable link (same tag every time) that always points
      # at the newest successful build on main, for installing straight
      # from the watch's browser without going through GitHub's UI:
      # https://github.com/iluy12/AAA/releases/download/latest-debug/app-debug.apk
      - name: Publish latest APK as a public GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-debug
          name: "Latest debug build"
          body: "Auto-published on every successful push to main. Commit: ${{ github.sha }}"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
