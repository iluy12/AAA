plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iluy.imutest'
    compileSdk 34

    defaultConfig {
        applicationId "com.iluy.imutest"
        // minSdk 26 matches the watch's Android 8.1 (API 27) — Foreground
        // Service + NotificationChannel APIs both require 26+.
        minSdk 26
        // targetSdk kept close to the device's real OS (28) on purpose:
        // avoids scoped-storage / background-service restrictions that
        // Android 29+ introduces, which would complicate this simple test.
        targetSdk 28
        // versionCode עולה עם כל ריצת CI. קודם הוא היה קבוע על 2, ולכן
        // כל הגרסאות נראו זהות לאנדרואיד ולא היה שום סימן חיצוני
        // שהתקנה בכלל תפסה. מחוץ ל-CI נופל ל-1.
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "1.0-build-${System.getenv("GITHUB_RUN_NUMBER") ?: "local"}"

        // גלוי במסך הבית — כדי לדעת בוודאות איזו גרסה מותקנת בפועל בלי לנחש.
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${new Date().format("yyyy-MM-dd HH:mm")}\""
    }

    buildFeatures {
        buildConfig true
    }

    /**
     * מפתח-חתימה קבוע, מוחזק ב-repo.
     *
     * בלעדיו כל ריצת CI מייצרת מפתח-דיבאג אקראי משלה (הרץ נוצר מאפס),
     * ואנדרואיד מסרב להתקין גרסה חדשה מעל אפליקציה שנחתמה במפתח אחר —
     * כלומר כל עדכון מחייב הסרה קודם. זה מה שיצר את הלולאה: כשעילוי היא
     * מסך-הבית, הסרה דורשת לאנצ'ר, והלאנצ'ר הוא עילוי עצמה.
     *
     * ⚠️ מפתח-דיבאג בלבד, ובכוונה לא-סודי (בדיוק כמו debug.keystore
     * הסטנדרטי של אנדרואיד, שסיסמתו "android" ידועה לכל). לגרסת-הפצה
     * אמיתית חייבים מפתח נפרד שנשמר בסוד, לא כזה שיושב ב-repo ציבורי.
     */
    signingConfigs {
        debug {
            storeFile file('../debug.p12')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
